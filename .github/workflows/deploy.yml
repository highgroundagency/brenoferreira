name: Deploy
on:
  push:
    branches: [main]
concurrency: deploy-prod
jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push
      - run: supabase config push
      - name: Segredo compartilhado das Edge Functions (criação única, fora do repo)
        run: |
          DATABASE_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-sa-east-1.pooler.supabase.com:5432/postgres"
          psql "$DATABASE_URL" -v secret="$EDGE_SHARED_SECRET" -c "select vault.create_secret(:'secret','edge_shared_secret') where not exists (select 1 from vault.secrets where name='edge_shared_secret')"
      - run: supabase secrets set EDGE_SHARED_SECRET="$EDGE_SHARED_SECRET"
      - run: supabase functions deploy whatsapp-send whatsapp-webhook --no-verify-jwt
  # Vercel faz o deploy do app por integração Git (região gru1); nada a fazer aqui.
